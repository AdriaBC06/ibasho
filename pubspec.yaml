name: ibasho
description: "Ibasho — 居場所, tu lugar. Un espacio de juegos multiplataforma."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado.
  flutter_riverpod: ^2.6.1

  # Red. Toda la comunicacion con Firebase es REST en Dart puro:
  # los plugins de FlutterFire no soportan Linux.
  http: ^1.6.0

  # Persistencia de la sesion.
  flutter_secure_storage: ^11.1.1
  pointycastle: ^4.0.0
  crypto: ^3.0.7

  # Fechas y numeros localizados.
  intl: 0.20.2

  # Musica y efectos.
  audioplayers: ^6.7.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  flutter_soloud: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Ibasho no usa ni un solo widget de Material con su aspecto por defecto:
  # la raiz de la app es WidgetsApp y todos los controles son propios.
  uses-material-design: false

  generate: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/fonts/LICENSES/

  fonts:
    # Interfaz. Gotica japonesa con kana completo (SIL OFL 1.1).
    - family: ZenKaku
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    # Reloj, numeros grandes y logotipo (SIL OFL 1.1).
    - family: Rounded
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
