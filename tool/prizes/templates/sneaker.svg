<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 34">
  <!-- Zapatilla del pie derecho, de tres cuartos. La suela pisa en y=32. -->
  <defs>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E2EA"/>
    </linearGradient>
  </defs>
  <!-- Empeine -->
  <path d="M6 24 C5 14 10 6 20 5 C27 4 31 9 35 13 C42 16 52 17 55 22 L56 26 L6 26 Z"
        fill="url(#upper)" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Puntera blanca -->
  <path d="M40 16.5 C47 17.5 53 18.5 55 22 L56 26 L41 26 C39 22 39 19 40 16.5 Z"
        fill="url(#sole)" stroke="{main.edge}" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Franja lateral -->
  <path d="M12 22 C18 16 26 14 34 18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Cordones -->
  <path d="M22 7 L28 11 M25 5.5 L31 10 M28 5 L33 9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M10 12 Q12 8 16 7" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Suela -->
  <path d="M4 25 L57 25 Q59 25 58.5 28 Q58 32 54 32 L7 32 Q3 32 3.2 28 Q3.4 25 4 25 Z"
        fill="url(#sole)" stroke="{main.edge}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M6 29 L55 29" stroke="{main}" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
</svg>
