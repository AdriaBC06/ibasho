<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Las hadas que pasan por delante (mismo lienzo que fairies.svg). -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".25" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}" stop-opacity=".7"/>
      <stop offset="1" stop-color="{main}" stop-opacity="0"/>
    </radialGradient>
    <g id="fairy">
      <circle r="13" fill="url(#glow)"/>
      <ellipse cx="-5" cy="-3.4" rx="5" ry="2.9" fill="#FFFFFF" fill-opacity=".8" stroke="{main.edge}" stroke-opacity=".45" stroke-width=".6" transform="rotate(-30 -5 -3.4)"/>
      <ellipse cx="5" cy="-3.4" rx="5" ry="2.9" fill="#FFFFFF" fill-opacity=".8" stroke="{main.edge}" stroke-opacity=".45" stroke-width=".6" transform="rotate(30 5 -3.4)"/>
      <circle r="3.6" fill="#FFFFFF" stroke="{main.deep}" stroke-width=".8"/>
    </g>
  </defs>
  <use href="#fairy" transform="translate(18 36) scale(1.45)"/>
  <use href="#fairy" transform="translate(104 64) scale(1.25)"/>
  <!-- Estela de polvo y destellos -->
  <g fill="{main}">
    <circle cx="26" cy="46" r="1.3"/><circle cx="30" cy="52" r="1"/><circle cx="33" cy="59" r=".8"/>
    <circle cx="97" cy="72" r="1.2"/><circle cx="92" cy="78" r=".9"/>
  </g>
  <path d="M10 70 Q10 74 14 74 Q10 74 10 78 Q10 74 6 74 Q10 74 10 70 Z" fill="{main.light}"/>
  <path d="M110 34 Q110 37 113 37 Q110 37 110 40 Q110 37 107 37 Q110 37 110 34 Z" fill="{main.light}"/>
</svg>
