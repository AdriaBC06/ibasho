<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- Corona. El aro apoya en la cabeza en (16..84, 62). -->
  <defs>
    <!-- Metal: bandas de luz y sombra, no un degradado plano -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".35" stop-color="{main}"/>
      <stop offset=".55" stop-color="{main.light}"/>
      <stop offset=".8" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <radialGradient id="ruby" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="{gem.light}"/>
      <stop offset="1" stop-color="{gem.deep}"/>
    </radialGradient>
    <radialGradient id="sapphire" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="{gem2.light}"/>
      <stop offset="1" stop-color="{gem2.deep}"/>
    </radialGradient>
  </defs>
  <!-- Cuerpo con cinco puntas -->
  <path d="M16 62 L12 26 L29 42 L36 18 L50 38 L64 18 L71 42 L88 26 L84 62 Q50 56 16 62 Z"
        fill="url(#metal)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bolitas de las puntas -->
  <g fill="url(#metal)" stroke="{main.edge}" stroke-width="1.5">
    <circle cx="12" cy="24" r="3.6"/><circle cx="36" cy="16" r="3.6"/><circle cx="50" cy="12" r="4.4"/>
    <circle cx="64" cy="16" r="3.6"/><circle cx="88" cy="24" r="3.6"/>
  </g>
  <path d="M50 38 L50 16" stroke="{main.edge}" stroke-width="2" stroke-linecap="round"/>
  <!-- Aro -->
  <path d="M14 52 Q50 45 86 52 L85 64 Q50 57 15 64 Z" fill="url(#metal)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <!-- Joyas -->
  <ellipse cx="50" cy="52.5" rx="5" ry="4.4" fill="url(#ruby)" stroke="{gem.edge}" stroke-width="1.1"/>
  <circle cx="31" cy="54.5" r="3" fill="url(#sapphire)" stroke="{gem2.edge}" stroke-width="1"/>
  <circle cx="69" cy="54.5" r="3" fill="url(#sapphire)" stroke="{gem2.edge}" stroke-width="1"/>
  <!-- Filo de luz y destello de la SSR -->
  <path d="M18 53 Q50 46.5 82 53" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M22 30 L25 49" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M40 4 Q40 9 45 9 Q40 9 40 14 Q40 9 35 9 Q40 9 40 4 Z" fill="#FFFFFF"/>
</svg>
