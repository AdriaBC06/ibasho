<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <!-- Antifaz C, «la mariposa»: alas abiertas con ocelos y filigrana. Diseno
       propio. Los ojos van en (35, 30) y (65, 30). -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path fill-rule="evenodd" fill="url(#face)" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"
        d="M50 22 C54 12 70 2 90 4 C98 5 98 14 94 22 C98 28 96 36 90 40 C84 50 72 52 62 46 C56 43 52 42 50 40
           C48 42 44 43 38 46 C28 52 16 50 10 40 C4 36 2 28 6 22 C2 14 2 5 10 4 C30 2 46 12 50 22 Z
           M44 31 C44 25 38 22 32 23 C27 24 23 27 23 31 C24 36 29 38 35 38 C40 38 44 35 44 31 Z
           M56 31 C56 25 62 22 68 23 C73 24 77 27 77 31 C76 36 71 38 65 38 C60 38 56 35 56 31 Z"/>
  <!-- Filigrana y ocelos -->
  <path d="M46 20 C38 12 24 8 12 9 M54 20 C62 12 76 8 88 9 M10 26 C14 22 20 21 24 23 M90 26 C86 22 80 21 76 23"
        fill="none" stroke="{trim}" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="{trim}" stroke="{trim.edge}" stroke-width=".8">
    <circle cx="13" cy="36" r="3.4"/><circle cx="87" cy="36" r="3.4"/><circle cx="84" cy="15" r="2.4"/><circle cx="16" cy="15" r="2.4"/>
  </g>
  <circle cx="13" cy="36" r="1.3" fill="#FFFFFF"/><circle cx="87" cy="36" r="1.3" fill="#FFFFFF"/>
  <!-- Cuerpo de la mariposa entre los ojos -->
  <path d="M50 18 Q53 26 50 36 Q47 26 50 18 Z" fill="{trim}" stroke="{trim.edge}" stroke-width=".9"/>
  <path d="M48.5 18 Q46 12 43 11 M51.5 18 Q54 12 57 11" fill="none" stroke="{trim}" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M12 8 C24 7 36 11 44 18 C34 13 24 11 14 12 Z" fill="url(#shine)"/>
</svg>
