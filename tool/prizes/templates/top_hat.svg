<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sombrero de copa. El ala apoya en la cabeza en (16..84, 86). -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{main.deep}"/>
      <stop offset=".3" stop-color="{main.light}"/>
      <stop offset=".6" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
  </defs>
  <!-- Copa, un poco mas ancha arriba -->
  <path d="M28 82 L25 16 Q25 10 31 10 L69 10 Q75 10 75 16 L72 82 Z" fill="url(#felt)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="50" cy="12" rx="24" ry="4" fill="{main.light}" stroke="{main.edge}" stroke-width="1.6"/>
  <!-- Cinta -->
  <path d="M27.3 64 Q50 68 72.7 64 L72.2 76 Q50 80 27.8 76 Z" fill="{band}" stroke="{band.edge}" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M29 68 Q50 72 71 68" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Ala -->
  <path d="M8 82 Q8 76 20 77 Q50 81 80 77 Q92 76 92 82 Q92 92 50 92 Q8 92 8 82 Z" fill="url(#brim)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M33 18 L35 60" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
</svg>
