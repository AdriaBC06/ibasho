<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 70">
  <!-- Lata de bebida energetica, de pie. La base pisa en y=68. -->
  <defs>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{main.deep}"/>
      <stop offset=".3" stop-color="{main.light}"/>
      <stop offset=".62" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C99A6"/>
      <stop offset=".3" stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#C9D3DD"/>
      <stop offset="1" stop-color="#8C99A6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{accent.light}"/>
      <stop offset="1" stop-color="{accent}"/>
    </linearGradient>
  </defs>
  <!-- Cuerpo -->
  <path d="M5 11 Q5 8 8 8 L22 8 Q25 8 25 11 L25 64 Q25 68 21 68 L9 68 Q5 68 5 64 Z"
        fill="url(#tin)" stroke="{main.edge}" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Rayo -->
  <path d="M18.5 15 L9.5 35 L14.5 35 L11 54 L21.5 29.5 L16 29.5 L20 15 Z"
        fill="url(#bolt)" stroke="{accent.edge}" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Rayitas de la marca -->
  <path d="M8.5 58.5 L14 58.5 M16 58.5 L21.5 58.5 M10 61.5 L20 61.5" stroke="{accent}" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Tapa y culo de aluminio -->
  <path d="M6.5 3.5 Q15 1.8 23.5 3.5 L25 9.5 Q15 11 5 9.5 Z" fill="url(#alu)" stroke="#5A6570" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="15" cy="4.2" rx="3.4" ry="1.3" fill="none" stroke="#5A6570" stroke-width="1"/>
  <path d="M5.2 63.5 Q15 65.5 24.8 63.5 L24.8 64 Q24.8 67.4 21 67.4 L9 67.4 Q5.2 67.4 5.2 64 Z" fill="url(#alu)"/>
  <path d="M5 64 Q5 68 9 68 L21 68 Q25 68 25 64" fill="none" stroke="{main.edge}" stroke-width="1.5"/>
  <!-- Brillo largo -->
  <path d="M8.5 13 L8.5 56" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round"/>
</svg>
