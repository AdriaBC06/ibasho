<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Brote en la coronilla: un tallo con dos hojitas iguales, una a cada
       lado, como la coronilla «brote» del creador. El tallo nace en (30, 57). -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main}"/>
    </linearGradient>
  </defs>
  <path d="M30 59 Q33.1 46.6 30 33.6" fill="none" stroke="{main.deep}" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M30 33.6 Q43 16.7 56 28.4 Q43 40.4 30 33.6 Z" fill="url(#leaf)" stroke="{main.edge}" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M30 33.6 Q17 16.7 4 28.4 Q17 40.4 30 33.6 Z" fill="url(#leaf)" stroke="{main.edge}" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
