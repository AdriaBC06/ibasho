<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40">
  <!-- Gafas de contraventana. Ojos en (35, 20) y (65, 20); se ven por las rendijas. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".5" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main}"/>
    </linearGradient>
  </defs>
  <!-- Patillas -->
  <path d="M20 14 L3 11 M80 14 L97 11" stroke="{main.edge}" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M20 14 L3 11 M80 14 L97 11" stroke="{main}" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Montura: dos lentes anchas con el puente -->
  <path fill-rule="evenodd" fill="url(#frame)" stroke="{main.edge}" stroke-width="1.6" stroke-linejoin="round"
        d="M17 9 Q17 5 22 5 L44 5 Q48 5 50 8 Q52 5 56 5 L78 5 Q83 5 83 9 L82 26 Q81 34 72 34 L60 34 Q53 34 52 28 L50 20 L48 28 Q47 34 40 34 L28 34 Q19 34 18 26 Z
           M21.5 9 L46 9 L44.5 27 Q44 30.5 40 30.5 L28 30.5 Q22.5 30.5 22 26 Z
           M54 9 L78.5 9 L78 26 Q77.5 30.5 72 30.5 L60 30.5 Q56 30.5 55.5 27 Z"/>
  <!-- Lamas -->
  <g fill="url(#slat)" stroke="{main.edge}" stroke-width=".8">
    <rect x="21" y="13" width="25" height="2.6" rx="1.3"/><rect x="21" y="18.5" width="24.6" height="2.6" rx="1.3"/><rect x="21.5" y="24" width="23.5" height="2.6" rx="1.3"/>
    <rect x="54" y="13" width="25" height="2.6" rx="1.3"/><rect x="54.4" y="18.5" width="24.6" height="2.6" rx="1.3"/><rect x="55" y="24" width="23.5" height="2.6" rx="1.3"/>
  </g>
  <path d="M20 7.2 L44 7.2 M56 7.2 L80 7.2" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Destello de la SSR -->
  <path d="M86 0 Q86 4 90 4 Q86 4 86 8 Q86 4 82 4 Q86 4 86 0 Z" fill="#FFFFFF"/>
</svg>
