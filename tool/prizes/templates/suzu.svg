<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 44">
  <!-- Collar con cascabel. El collar cruza en y = 10, de x = 5 a 65. -->
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <radialGradient id="bell" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="{bell.light}"/>
      <stop offset="1" stop-color="{bell.deep}"/>
    </radialGradient>
  </defs>
  <!-- Collar, un poco curvo -->
  <path d="M4 6 Q35 16 66 6 L66 13 Q35 23 4 13 Z" fill="url(#strap)" stroke="{main.edge}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M8 9 Q35 18 62 9" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 2.4"/>
  <!-- Anilla y cascabel -->
  <circle cx="35" cy="19" r="2.6" fill="none" stroke="{bell.edge}" stroke-width="1.6"/>
  <circle cx="35" cy="30" r="10" fill="url(#bell)" stroke="{bell.edge}" stroke-width="1.6"/>
  <path d="M25.6 28 Q35 31 44.4 28" fill="none" stroke="{bell.edge}" stroke-width="1.3"/>
  <circle cx="35" cy="34" r="2" fill="{bell.edge}"/>
  <path d="M35 35 L35 39.4" stroke="{bell.edge}" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M29 24 Q31 22 34 22" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.3" stroke-linecap="round"/>
</svg>
