<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Birrete de graduacion. El gorro apoya en la cabeza en (22..78, 66). -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".6" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main}"/>
    </linearGradient>
  </defs>
  <!-- Gorro -->
  <path d="M24 66 L26 36 Q50 44 74 36 L76 66 Q50 72 24 66 Z" fill="url(#cloth)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30 44 L29 62" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <!-- Tabla, vista un poco desde arriba -->
  <path d="M50 18 L94 32 L50 46 L6 32 Z" fill="url(#board)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M6 32 L6 35 L50 49 L94 35 L94 32 L50 46 Z" fill="{main.deep}" stroke="{main.edge}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M20 30 L50 21 L60 24" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Boton y borla -->
  <path d="M50 32 Q70 34 82 36 L84 52" fill="none" stroke="{tassel.edge}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 32 Q70 34 82 36 L84 52" fill="none" stroke="{tassel}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="50" cy="32" rx="4" ry="2.4" fill="{tassel}" stroke="{tassel.edge}" stroke-width="1.2"/>
  <path d="M81 52 L87 52 L88.4 64 Q84 66 79.6 64 Z" fill="{tassel}" stroke="{tassel.edge}" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M82 55 L82 63 M84 55 L84 64 M86 55 L86 63" stroke="{tassel.edge}" stroke-opacity=".5" stroke-width=".8"/>
  <rect x="80.6" y="50" width="6.8" height="3.4" rx="1.2" fill="{tassel.light}" stroke="{tassel.edge}" stroke-width="1"/>
</svg>
