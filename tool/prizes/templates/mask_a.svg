<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <!-- Antifaz A, «el ladron»: blanco con puntas de ala y ribete de color.
       Los ojos van en (35, 30) y (65, 30). -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Pieza con los dos agujeros (par-impar) -->
  <path fill-rule="evenodd" fill="url(#face)" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"
        d="M50 22 C58 15 70 12 84 15 L97 6 L94 21 C96 36 87 47 72 47 C62 47 56 42 50 39
           C44 42 38 47 28 47 C13 47 4 36 6 21 L3 6 L16 15 C30 12 42 15 50 22 Z
           M45 31 C45 24 38 21 32 22 C27 23 22 25 19 24 C21 32 26 38 34 38 C40 38 45 36 45 31 Z
           M55 31 C55 24 62 21 68 22 C73 23 78 25 81 24 C79 32 74 38 66 38 C60 38 55 36 55 31 Z"/>
  <!-- Ribete alrededor de los ojos -->
  <path d="M19 24 C23 26 28 23 33 22 M81 24 C77 26 72 23 67 22" fill="none" stroke="{trim}" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Filigrana en las puntas -->
  <path d="M14 20 Q10 26 13 33 M86 20 Q90 26 87 33" fill="none" stroke="{trim}" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M50 26 L47 34 L50 36 L53 34 Z" fill="{trim}" stroke="{trim.edge}" stroke-width=".8" stroke-linejoin="round"/>
  <!-- Brillo -->
  <path d="M18 18 C26 15 36 16 44 21 C36 19 27 19 20 22 Z" fill="url(#shine)"/>
  <path d="M58 20 C64 16 74 15 80 16 C74 18 66 19 60 22 Z" fill="url(#shine)"/>
</svg>
