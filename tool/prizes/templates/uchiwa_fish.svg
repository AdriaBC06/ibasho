<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 64">
  <!-- Abanico uchiwa con un pez y olas, en la mano izquierda: el mango acaba
       en (36, 60), pegado al costado. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset="1" stop-color="{main}"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-14 22 34)">
    <path d="M20.5 38 L23.5 38 L23.8 62 Q22 64 20.2 62 Z" fill="{rim}" stroke="{rim.edge}" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="22" cy="21" r="18" fill="url(#paper)" stroke="{rim.edge}" stroke-width="1.8"/>
    <!-- Olas -->
    <path d="M6 28 Q10 25 14 28 Q18 31 22 28 Q26 25 30 28 Q34 31 38 28" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M9 33 Q13 30 17 33 Q21 36 25 33 Q29 30 33 33" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Pez rojo -->
    <path d="M13 18 Q18 11 26 16 L31 12 Q30 17 31 22 L26 19 Q18 25 13 18 Z" fill="{fish}" stroke="{fish.edge}" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="16.5" cy="17" r="1" fill="{fish.edge}"/>
    <circle cx="22" cy="21" r="16.6" fill="none" stroke="{rim}" stroke-width="2.2"/>
    <path d="M10 12 Q14 7.5 19 6.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
