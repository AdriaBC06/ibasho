<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gorro de chef. La banda apoya en la cabeza en (22..78, 76). -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
  </defs>
  <!-- Seta abullonada: circulos con el filo solo por fuera -->
  <g fill="{main.edge}" stroke="{main.edge}" stroke-width="3.4">
    <circle cx="30" cy="40" r="17"/><circle cx="50" cy="28" r="20"/><circle cx="70" cy="40" r="17"/><circle cx="40" cy="48" r="14"/><circle cx="60" cy="48" r="14"/>
  </g>
  <g fill="url(#cloth)">
    <circle cx="30" cy="40" r="17"/><circle cx="50" cy="28" r="20"/><circle cx="70" cy="40" r="17"/><circle cx="40" cy="48" r="14"/><circle cx="60" cy="48" r="14"/>
  </g>
  <path d="M38 34 Q40 44 38 54 M62 34 Q60 44 62 54" fill="none" stroke="{main.edge}" stroke-opacity=".25" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Banda -->
  <path d="M24 54 L76 54 L78 76 Q50 72 22 76 Z" fill="url(#cloth)" stroke="{main.edge}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 56 L33.5 73 M50 56 L50 72.5 M66 56 L66.5 73" stroke="{main.edge}" stroke-opacity=".22" stroke-width="1.6"/>
  <path d="M36 16 Q42 10 50 10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
