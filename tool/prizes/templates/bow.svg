<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <!-- Lazo grande. El nudo, en (40, 26), va en la cabeza un poco a un lado. -->
  <defs>
    <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
  </defs>
  <!-- Colas -->
  <path d="M36 30 L26 46 L32 44 L35 48 L40 32 Z M44 30 L54 46 L48 44 L45 48 L40 32 Z" fill="url(#silk)" stroke="{main.edge}" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Lazadas -->
  <path d="M36 23 C26 8 8 6 5 14 C2 22 6 36 14 38 C22 40 30 34 36 29 Z M44 23 C54 8 72 6 75 14 C78 22 74 36 66 38 C58 40 50 34 44 29 Z"
        fill="url(#silk)" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M12 16 Q20 18 30 25 M12 32 Q22 30 30 28 M68 16 Q60 18 50 25 M68 32 Q58 30 50 28"
        fill="none" stroke="{main.edge}" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9 14 Q12 10 18 11" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nudo -->
  <rect x="34" y="20" width="12" height="13" rx="4.5" fill="url(#silk)" stroke="{main.edge}" stroke-width="1.8"/>
  <path d="M37 23 Q40 22 43 23" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>
</svg>
