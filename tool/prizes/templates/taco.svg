<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 54">
  <!-- Taco, en la mano izquierda: la tortilla, de canto, con el relleno
       asomando por arriba. Va algo inclinado; se sujeta por (60, 38), el lado del cuerpo. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{main.light}"/>
      <stop offset=".55" stop-color="{main}"/>
      <stop offset="1" stop-color="{main.deep}"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 6) rotate(-10 30 26)">
  <!-- La otra cara de la tortilla, por detras del relleno -->
  <path d="M3 22 C4 4 56 4 57 22 Z" fill="{main.deep}" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Relleno: carne, lechuga, tomate y queso -->
  <path d="M8 23 C8 16 16 10 22 12 C26 7 34 7 38 11 C44 9 52 14 52 26 Z" fill="#8A4B2E" stroke="#4E2A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M7 24 C6 18 11 14 15 16 C16 11 22 10 25 13 C28 9 34 9 36 13 C40 10 46 12 47 16 C51 15 54 19 53 24 Z"
        fill="#7FD06A" stroke="#3E7A3A" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="#F0535E" stroke="#8A2A33" stroke-width="1">
    <circle cx="17" cy="15.5" r="3"/><circle cx="31" cy="12.5" r="3"/><circle cx="43" cy="16" r="3"/>
  </g>
  <path d="M12 17 L15 21 M22 14 L24 19 M36 14 L35 19 M47 18 L44 21" stroke="#FFD24A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Tortilla doblada, de canto: media luna con la boca arriba -->
  <path d="M3 21 Q30 26 57 21 C57 34 45 42 30 42 C15 42 3 34 3 21 Z"
        fill="url(#shell)" stroke="{main.edge}" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Motitas tostadas y brillo -->
  <g fill="{main.edge}" fill-opacity=".35">
    <circle cx="14" cy="31" r="1.2"/><circle cx="23" cy="36" r="1"/><circle cx="36" cy="35" r="1.3"/><circle cx="46" cy="30" r="1"/><circle cx="29" cy="30" r=".9"/><circle cx="40" cy="39" r=".8"/>
  </g>
  <path d="M7 26 Q10 33 17 37" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
