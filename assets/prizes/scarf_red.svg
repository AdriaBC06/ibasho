<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 46">
  <!-- Bufanda al cuello. La vuelta cruza de x=5 a 65 con el centro en y=16;
       las puntas cuelgan a la derecha del Tama (a la izquierda del dibujo). -->
  <defs>
    <linearGradient id="knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08D94"/>
      <stop offset=".55" stop-color="#E8505B"/>
      <stop offset="1" stop-color="#C04853"/>
    </linearGradient>
  </defs>
  <!-- Vuelta alrededor del cuello -->
  <path d="M5 9 Q35 19 65 9 L66 19 Q35 30 4 19 Z" fill="url(#knit)" stroke="#853B48" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M8 14 Q35 23 62 14" fill="none" stroke="#853B48" stroke-opacity=".3" stroke-width="1.1" stroke-dasharray="2 2"/>
  <!-- Puntas colgando, con rayas y flecos -->
  <path d="M16 20 L12 40 L22 41 L24 22 Z" fill="url(#knit)" stroke="#853B48" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M22 21 L24 38 L33 36 L28 21 Z" fill="url(#knit)" stroke="#853B48" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M13.3 33.5 L22.6 34.4 M12.8 36.6 L22.3 37.5 M23.6 32 L31.2 30.5 M24 35 L32.2 33.4" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M13 41 L12.4 44.5 M15.5 41.3 L15.2 44.8 M18 41.5 L18 45 M20.5 41.7 L20.8 45 M25.2 38 L25.8 41.5 M28 37.4 L28.9 40.8 M30.8 36.8 L31.8 40.2"
        stroke="#C04853" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Nudo -->
  <ellipse cx="23" cy="20" rx="6" ry="5" fill="url(#knit)" stroke="#853B48" stroke-width="1.8"/>
  <path d="M9 11.5 Q16 14 22 15" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
</svg>
