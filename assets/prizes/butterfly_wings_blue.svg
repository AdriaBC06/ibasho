<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Alas de mariposa a la espalda. El cuerpo va de x=30 a 90 y el anclaje
       en (60, 50), como las alas de angel. -->
  <defs>
    <radialGradient id="wing" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#94C6F5"/>
      <stop offset=".7" stop-color="#5AA7F0"/>
      <stop offset="1" stop-color="#4C8FCD"/>
    </radialGradient>
  </defs>
  <g stroke="#366B9A" stroke-width="2" stroke-linejoin="round" fill="url(#wing)">
    <!-- Alas de arriba -->
    <path d="M56 46 C46 26 26 12 12 16 C2 20 4 38 14 48 C24 56 42 56 56 50 Z"/>
    <path d="M64 46 C74 26 94 12 108 16 C118 20 116 38 106 48 C96 56 78 56 64 50 Z"/>
    <!-- Alas de abajo -->
