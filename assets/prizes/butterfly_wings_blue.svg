    <path d="M64 52 C76 56 92 62 96 74 C98 84 88 90 78 84 C70 78 64 66 62 56 Z"/>
  </g>
  <!-- Dibujo de las alas -->
  <g fill="#F5C542" stroke="#8C7C3A" stroke-width="1">
    <ellipse cx="24" cy="30" rx="7" ry="6"/>
    <ellipse cx="96" cy="30" rx="7" ry="6"/>
    <circle cx="36" cy="74" r="4.6"/>
    <circle cx="84" cy="74" r="4.6"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".85">
    <circle cx="22" cy="28" r="2"/><circle cx="94" cy="28" r="2"/>
    <circle cx="40" cy="38" r="1.6"/><circle cx="80" cy="38" r="1.6"/>
    <circle cx="35" cy="72" r="1.4"/><circle cx="83" cy="72" r="1.4"/>
  </g>
  <path d="M54 46 C46 34 32 24 20 22 M66 46 C74 34 88 24 100 22 M56 54 C46 60 36 66 32 76 M64 54 C74 60 84 66 88 76"
        fill="none" stroke="#366B9A" stroke-opacity=".3" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M12 26 Q16 19 24 18" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
</svg>
