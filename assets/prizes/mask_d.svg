<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <!-- Antifaz D, «el cuervo»: frente de plumas y un pico corto que baja por
       la nariz. Diseno propio. Los ojos van en (35, 30) y (65, 30). -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#757B85"/>
      <stop offset=".55" stop-color="#2B3444"/>
      <stop offset="1" stop-color="#253140"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8D984"/>
      <stop offset="1" stop-color="#CBA83F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path fill-rule="evenodd" fill="url(#face)" stroke="#1D2C3B" stroke-width="1.8" stroke-linejoin="round"
        d="M50 12 C60 8 74 8 84 12 L96 8 L91 18 L98 22 L90 27 C92 36 86 44 74 44 C64 44 56 40 50 38
           C44 40 36 44 26 44 C14 44 8 36 10 27 L2 22 L9 18 L4 8 L16 12 C26 8 40 8 50 12 Z
           M44 31 C44 25 38 22 32 23 C27 24 23 27 23 31 C24 36 29 38 35 38 C40 38 44 35 44 31 Z
           M56 31 C56 25 62 22 68 23 C73 24 77 27 77 31 C76 36 71 38 65 38 C60 38 56 35 56 31 Z"/>
  <!-- Plumas de la frente -->
  <path d="M24 18 Q32 14 42 17 M58 17 Q68 14 76 18 M16 22 Q20 20 24 21 M84 22 Q80 20 76 21"
        fill="none" stroke="#1D2C3B" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M23 31 C24 36 29 38 35 38 C40 38 44 35 44 31 M56 31 C56 35 60 38 65 38 C71 38 76 36 77 31"
        fill="none" stroke="#F5C542" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pico -->
  <path d="M44 24 Q50 20 56 24 L53 44 Q50 50 47 44 Z" fill="url(#beak)" stroke="#8C7C3A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M48 27 L48 40" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M18 14 C26 11 36 11 44 14 C36 14 26 15 20 18 Z" fill="url(#shine)"/>
</svg>
