<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70">
  <!-- Kendama en la mano izquierda: el mango acaba en (36, 67), pegado al
       costado, y la bola cuelga del hilo. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C08A52"/>
      <stop offset=".35" stop-color="#F0C890"/>
      <stop offset="1" stop-color="#A8743F"/>
    </linearGradient>
    <radialGradient id="ball" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#F0838D"/>
      <stop offset=".55" stop-color="#E8404F"/>
      <stop offset="1" stop-color="#C03B49"/>
    </radialGradient>
  </defs>
  <!-- Hilo -->
  <path d="M36 44 C26 50 14 44 13 32" fill="none" stroke="#E6EDF3" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Ken: pincho, platos y mango -->
  <path d="M33 44 L39 44 L38.5 66 Q36 68.5 33.5 66 Z" fill="url(#wood)" stroke="#6E4520" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M34 22 L36 10 L38 22 Z" fill="url(#wood)" stroke="#6E4520" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M24 26 Q24 23 26 23 L46 23 Q48 23 48 26 L48 31 Q48 33 46 33 L26 33 Q24 33 24 31 Z" fill="url(#wood)" stroke="#6E4520" stroke-width="1.4"/>
  <path d="M33 33 L39 33 L39 44 L33 44 Z" fill="url(#wood)" stroke="#6E4520" stroke-width="1.4"/>
  <path d="M22 24 Q24 28 22 32 M50 24 Q48 28 50 32" fill="none" stroke="#6E4520" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Bola -->
  <circle cx="12" cy="21" r="10" fill="url(#ball)" stroke="#853241" stroke-width="1.6"/>
  <circle cx="13.5" cy="30" r="1.8" fill="#853241"/>
  <path d="M5 21 Q12 25 19 21" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.4"/>
  <ellipse cx="8.5" cy="15.5" rx="3.2" ry="2.2" fill="#FFFFFF" fill-opacity=".85" transform="rotate(-30 8.5 15.5)"/>
  <!-- Destello de la SSR -->
  <path d="M4 36 Q4 40 8 40 Q4 40 4 44 Q4 40 0 40 Q4 40 4 36 Z" fill="#FFFFFF"/>
</svg>
