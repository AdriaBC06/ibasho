<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44">
  <!-- Hachimaki: la cinta cruza la frente de (10..110) y se anuda a la derecha. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0838D"/>
      <stop offset=".55" stop-color="#E8404F"/>
      <stop offset="1" stop-color="#C03B49"/>
    </linearGradient>
    <radialGradient id="sun" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>
  <!-- Colas del nudo, detras -->
  <path d="M104 20 C110 24 114 32 118 40 C113 39 108 34 104 26 Z"
        fill="url(#band)" stroke="#853241" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M104 20 C112 20 116 26 119 30 C113 31 108 28 103 25 Z"
        fill="url(#band)" stroke="#853241" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- La cinta, combada como la cabeza -->
  <path d="M10 13 Q60 23 110 13 L110 25 Q60 35 10 25 Z"
        fill="url(#band)" stroke="#853241" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M16 16 Q60 24.5 104 16" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- El sol en la frente -->
  <circle cx="60" cy="23.5" r="5.2" fill="url(#sun)" stroke="#919CA2" stroke-opacity=".5" stroke-width=".8"/>
  <!-- Nudo -->
  <ellipse cx="104" cy="21" rx="4.2" ry="4.8" fill="url(#band)" stroke="#853241" stroke-width="1.4"/>
</svg>
