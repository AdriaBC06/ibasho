  <path d="M15.5 21 L15.5 38" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 8 Q42 12 46 12 Q42 12 42 16 Q42 12 38 12 Q42 12 42 8 Z" fill="#B9A6FF"/>
  <path d="M6 50 Q6 53 9 53 Q6 53 6 56 Q6 53 3 53 Q6 53 6 50 Z" fill="#B9A6FF"/>
