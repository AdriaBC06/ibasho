<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Auriculares gamer con micro y luz. La cabeza ocupa (14..86) a la altura
       de los cascos, y=52; el arco pasa por encima de la coronilla, y=6. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#757B85"/>
      <stop offset=".55" stop-color="#2B3444"/>
      <stop offset="1" stop-color="#253140"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#5BE07A"/>
      <stop offset="1" stop-color="#4DBE6D"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BE07A"/>
      <stop offset="1" stop-color="#94EBA9"/>
    </linearGradient>
  </defs>
  <!-- Arco con la franja de luz -->
  <path d="M12 50 C10 22 28 5 50 5 C72 5 90 22 88 50" fill="none" stroke="#1D2C3B" stroke-width="9.4" stroke-linecap="round"/>
  <path d="M12 50 C10 22 28 5 50 5 C72 5 90 22 88 50" fill="none" stroke="url(#shell)" stroke-width="6.6" stroke-linecap="round"/>
  <path d="M30 13 C36 9 44 7.5 50 7.5 C56 7.5 64 9 70 13" fill="none" stroke="url(#glow)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Micro que baja hacia la boca -->
  <path d="M10 62 C12 72 20 76 30 76" fill="none" stroke="#1D2C3B" stroke-width="4" stroke-linecap="round"/>
  <path d="M10 62 C12 72 20 76 30 76" fill="none" stroke="#2B3444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="31" cy="76" r="3" fill="#2B3444" stroke="#1D2C3B" stroke-width="1.3"/>
  <g id="cup">
    <rect x="14" y="38" width="7" height="28" rx="3.5" fill="#3A4455" stroke="#1E2733" stroke-width="1.1"/>
    <path d="M2 44 Q2 34 11 34 L13 34 Q19 34 19 44 L19 60 Q19 70 13 70 L11 70 Q2 70 2 60 Z" fill="url(#shell)" stroke="#1D2C3B" stroke-width="1.8"/>
    <ellipse cx="10.5" cy="52" rx="5.2" ry="9" fill="url(#light)" stroke="#378A59" stroke-width="1"/>
    <path d="M5 42 Q6 37 10 36.5" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <use href="#cup" transform="matrix(-1 0 0 1 100 0)"/>
  <!-- Destello de la SSR -->
  <path d="M92 2 Q92 6 96 6 Q92 6 92 10 Q92 6 88 6 Q92 6 92 2 Z" fill="#FFFFFF"/>
</svg>
