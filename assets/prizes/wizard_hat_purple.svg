<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sombrero de mago con estrellas. La copa apoya en la cabeza en
       (24..76, 80); el ala sobresale un poco. -->
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A98DDB"/>
      <stop offset=".55" stop-color="#7A4FC8"/>
      <stop offset="1" stop-color="#6647AD"/>
    </linearGradient>
  </defs>
  <!-- Cono recto con la punta un poco caida -->
  <path d="M24 78 L46 12 Q50 4 56 8 Q60 10 58 16 L76 78 Z" fill="url(#velvet)" stroke="#483B84" stroke-width="2" stroke-linejoin="round"/>
  <path d="M38 60 L48 20" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <!-- Estrellas y luna bordadas -->
  <g fill="#FFD84A" stroke="#91863E" stroke-width=".8">
    <path d="M54 34 L56 38.5 L61 39 L57.3 42.3 L58.4 47 L54 44.6 L49.6 47 L50.7 42.3 L47 39 L52 38.5 Z"/>
    <path d="M40 56 L41.4 59.2 L45 59.6 L42.3 62 L43.1 65.4 L40 63.6 L36.9 65.4 L37.7 62 L35 59.6 L38.6 59.2 Z"/>
    <path d="M62 58 A6 6 0 1 0 68 66 A4.5 4.5 0 1 1 62 58 Z"/>
  </g>
  <circle cx="50" cy="26" r="1.3" fill="#FFD84A"/><circle cx="60" cy="52" r="1.2" fill="#FFD84A"/><circle cx="46" cy="70" r="1.1" fill="#FFD84A"/>
  <!-- Ala -->
  <path d="M10 82 Q10 76 26 77 Q50 80 74 77 Q90 76 90 82 Q90 89 50 89 Q10 89 10 82 Z" fill="url(#velvet)" stroke="#483B84" stroke-width="2" stroke-linejoin="round"/>
  <path d="M18 81 Q32 83 44 83.4" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Estrellas que titilan (SSR) -->
  <path d="M74 20 Q74 25 79 25 Q74 25 74 30 Q74 25 69 25 Q74 25 74 20 Z" fill="#FFFFFF"/>
  <path d="M26 36 Q26 39 29 39 Q26 39 26 42 Q26 39 23 39 Q26 39 26 36 Z" fill="#FFE689"/>
</svg>
