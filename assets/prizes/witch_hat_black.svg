<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sombrero de bruja. La copa apoya en la cabeza en (24..76, 80); el ala
       sobresale. -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#757B85"/>
      <stop offset=".55" stop-color="#2B3444"/>
      <stop offset="1" stop-color="#253140"/>
    </linearGradient>
  </defs>
  <!-- Cono con la punta doblada -->
  <path d="M26 78 C32 60 38 40 50 24 C56 16 64 10 76 8 C70 14 64 20 62 30 C64 46 70 62 74 78 Z"
        fill="url(#felt)" stroke="#1D2C3B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 58 Q46 40 54 28" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <!-- Cinta con hebilla -->
  <path d="M28.5 70 Q50 74 71.5 70 L73 78 Q50 82 27 78 Z" fill="#9A6BE0" stroke="#5A4A91" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="44" y="69.5" width="12" height="10" rx="1.5" fill="none" stroke="#F5C542" stroke-width="2.4"/>
  <!-- Ala ancha -->
  <path d="M4 82 Q4 76 24 77 Q50 80 76 77 Q96 76 96 82 Q96 90 50 90 Q4 90 4 82 Z" fill="url(#felt)" stroke="#1D2C3B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12 81 Q30 83 44 83.5" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/>
</svg>
