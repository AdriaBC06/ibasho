<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 44">
  <!-- Corona de flores. Apoya en la cabeza en (12..88, 30). -->
  <defs>
    <radialGradient id="petal" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#F9DF7F"/>
      <stop offset="1" stop-color="#F6CE3A"/>
    </radialGradient>
    <g id="flower">
      <g fill="url(#petal)" stroke="#8C8136" stroke-width="1">
        <circle cx="0" cy="-5" r="4.2"/><circle cx="4.8" cy="-1.5" r="4.2"/><circle cx="3" cy="4" r="4.2"/><circle cx="-3" cy="4" r="4.2"/><circle cx="-4.8" cy="-1.5" r="4.2"/>
      </g>
      <circle r="3" fill="#7A4A2E" stroke="#48382F" stroke-width=".9"/>
      <circle cx="-1" cy="-1" r="1" fill="#FFFFFF" fill-opacity=".7"/>
    </g>
  </defs>
  <!-- Tallo trenzado -->
  <path d="M8 26 Q50 38 92 26" fill="none" stroke="#3E9E62" stroke-width="4" stroke-linecap="round"/>
  <path d="M8 26 Q50 38 92 26" fill="none" stroke="#74DDA2" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
  <g fill="#5BC87A" stroke="#2F7A4A" stroke-width=".9">
    <path d="M22 30 Q18 36 12 36 Q15 30 22 30 Z"/><path d="M60 33 Q64 39 70 38 Q67 32 60 33 Z"/><path d="M40 33 Q37 39 31 40 Q33 34 40 33 Z"/><path d="M80 29 Q86 33 90 32 Q86 27 80 29 Z"/>
  </g>
  <use href="#flower" transform="translate(12 25)"/>
  <use href="#flower" transform="translate(30 30) scale(1.15)"/>
  <use href="#flower" transform="translate(50 32) scale(1.3)"/>
  <use href="#flower" transform="translate(70 30) scale(1.15)"/>
  <use href="#flower" transform="translate(88 25)"/>
