<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gorro de rana. El borde apoya en la cabeza en (16..84, 72). -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8BDDB"/>
      <stop offset=".55" stop-color="#F59AC8"/>
      <stop offset="1" stop-color="#CB84AD"/>
    </linearGradient>
    <radialGradient id="eye" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EAF0"/>
    </radialGradient>
  </defs>
  <!-- Ojos saltones, detras del gorro -->
  <g fill="url(#skin)" stroke="#8C6484" stroke-width="2">
    <circle cx="31" cy="34" r="14"/><circle cx="69" cy="34" r="14"/>
  </g>
  <!-- Copa -->
  <path d="M16 72 C15 50 28 36 50 36 C72 36 85 50 84 72 Q50 66 16 72 Z" fill="url(#skin)" stroke="#8C6484" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ojos por delante -->
  <g stroke="#8C6484" stroke-width="1.5">
    <circle cx="31" cy="32" r="9" fill="url(#eye)"/><circle cx="69" cy="32" r="9" fill="url(#eye)"/>
  </g>
  <circle cx="32" cy="33" r="4.5" fill="#2B3444"/><circle cx="68" cy="33" r="4.5" fill="#2B3444"/>
  <circle cx="30.5" cy="31" r="1.6" fill="#FFFFFF"/><circle cx="66.5" cy="31" r="1.6" fill="#FFFFFF"/>
  <!-- Boca y mofletes -->
  <path d="M36 54 Q50 62 64 54" fill="none" stroke="#8C6484" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="27" cy="56" rx="5" ry="3" fill="#E8505B" fill-opacity=".7"/><ellipse cx="73" cy="56" rx="5" ry="3" fill="#E8505B" fill-opacity=".7"/>
  <path d="M22 50 Q24 44 30 42" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
</svg>
