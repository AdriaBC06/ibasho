<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kabuto samurai: cuenco, faldon por los lados y crest dorado. El borde
       apoya en la cabeza en (18..82, 72). -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DB7A82"/>
      <stop offset=".55" stop-color="#C8323F"/>
      <stop offset="1" stop-color="#A62F3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D984"/>
      <stop offset=".4" stop-color="#F5C542"/>
      <stop offset=".6" stop-color="#F8D984"/>
      <stop offset="1" stop-color="#CBA83F"/>
    </linearGradient>
  </defs>
  <!-- Faldon en capas, por los lados de la cabeza -->
  <g id="flap">
    <path d="M18 62 L6 70 L8 80 L22 74 Z" fill="url(#lacquer)" stroke="#732B38" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M16 70 L4 78 L7 88 L20 82 Z" fill="url(#lacquer)" stroke="#732B38" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M7 76 L20 70 M8 84 L19 79" stroke="#F5C542" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <use href="#flap" transform="matrix(-1 0 0 1 100 0)"/>
  <!-- Cuenco con sus gajos -->
  <path d="M18 66 C18 42 32 32 50 32 C68 32 82 42 82 66 Z" fill="url(#lacquer)" stroke="#732B38" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 36 Q30 50 30 66 M50 33 L50 66 M66 36 Q70 50 70 66" fill="none" stroke="#732B38" stroke-opacity=".35" stroke-width="1.4"/>
  <path d="M26 50 C28 42 34 37 42 35" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
  <!-- Visera -->
  <path d="M14 66 Q50 58 86 66 L84 74 Q50 67 16 74 Z" fill="url(#lacquer)" stroke="#732B38" stroke-width="2" stroke-linejoin="round"/>
  <!-- Crest: dos cuernos dorados en V y el medallon -->
  <path d="M46 60 C36 48 28 30 26 8 C32 20 40 36 50 50 C60 36 68 20 74 8 C72 30 64 48 54 60 Z"
        fill="url(#gold)" stroke="#8C7C3A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="50" cy="60" r="7" fill="url(#gold)" stroke="#8C7C3A" stroke-width="1.6"/>
  <circle cx="50" cy="60" r="3" fill="#C8323F" stroke="#8C7C3A" stroke-width=".8"/>
  <!-- Destello de la SSR -->
  <path d="M86 20 Q86 24 90 24 Q86 24 86 28 Q86 24 82 24 Q86 24 86 20 Z" fill="#FFFFFF"/>
</svg>
