<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 70">
  <!-- Botella de agua de plastico, de pie. La base pisa en y=68. -->
  <defs>
    <linearGradient id="clear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77B3D3" stop-opacity=".75"/>
      <stop offset=".3" stop-color="#B6E2FA" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#8FD3F7" stop-opacity=".6"/>
      <stop offset="1" stop-color="#77B3D3" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3F7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#77B3D3" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82ACEB"/>
      <stop offset="1" stop-color="#356EC0"/>
    </linearGradient>
  </defs>
  <!-- Envase -->
  <path d="M11 10 L19 10 L19 14 C25 17 27 21 27 26 L27 62 Q27 68 21 68 L9 68 Q3 68 3 62 L3 26 C3 21 5 17 11 14 Z"
        fill="url(#clear)" stroke="#54839D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Agua, hasta un poco mas de la mitad -->
  <path d="M4 34 Q15 32 26 34 L26 62 Q26 67 21 67 L9 67 Q4 67 4 62 Z" fill="url(#water)"/>
  <!-- Anillos del plastico -->
  <path d="M3.5 40 Q15 42 26.5 40 M3.5 52 Q15 54 26.5 52" fill="none" stroke="#54839D" stroke-opacity=".35" stroke-width="1.1"/>
  <!-- Etiqueta -->
  <rect x="3" y="43" width="24" height="7" fill="#FFFFFF" fill-opacity=".9"/>
  <path d="M8 46.5 Q12 44 15 46.5 Q18 49 22 46.5" fill="none" stroke="#3E7FE0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Tapon -->
  <rect x="10" y="3" width="10" height="8" rx="2" fill="url(#cap)" stroke="#275591" stroke-width="1.3"/>
  <path d="M12 5 L12 9.5 M15 5 L15 9.5 M18 5 L18 9.5" stroke="#275591" stroke-opacity=".4" stroke-width=".8"/>
  <!-- Brillo largo -->
  <path d="M7 24 L7 60" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
</svg>
