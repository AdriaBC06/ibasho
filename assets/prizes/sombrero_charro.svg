<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70">
  <!-- Sombrero mexicano de ala muy ancha. La copa apoya en la cabeza en
       (38..82, 56); el ala sobresale mucho. -->
  <defs>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#757B85"/>
      <stop offset=".55" stop-color="#2B3444"/>
      <stop offset="1" stop-color="#253140"/>
    </linearGradient>
  </defs>
  <!-- Ala, con el borde levantado -->
  <path d="M2 50 Q4 44 12 46 Q60 58 108 46 Q116 44 118 50 Q116 62 60 64 Q4 62 2 50 Z"
        fill="url(#straw)" stroke="#1D2C3B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8 51 Q60 62 112 51" fill="none" stroke="#F5C542" stroke-width="2" stroke-linecap="round"/>
  <!-- Copa -->
  <path d="M40 56 C38 36 42 14 60 12 C78 14 82 36 80 56 Q60 60 40 56 Z" fill="url(#straw)" stroke="#1D2C3B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 14 Q56 30 58 56" fill="none" stroke="#1D2C3B" stroke-opacity=".3" stroke-width="1.4"/>
  <!-- Cinta bordada en zigzag -->
  <path d="M40.5 44 Q60 48 79.5 44 L80 53 Q60 57 40 53 Z" fill="#F5C542" stroke="#8C7C3A" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M42 50 L46 46.5 L50 50.5 L54 47 L58 51 L62 47 L66 51 L70 47 L74 50.5 L78 46.5" fill="none" stroke="#E23B4E" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Borlas colgando del ala -->
  <g fill="#F5C542" stroke="#8C7C3A" stroke-width="1">
    <circle cx="12" cy="60" r="3"/><circle cx="108" cy="60" r="3"/>
  </g>
  <path d="M47 42 C46 32 48 22 54 17" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
</svg>
