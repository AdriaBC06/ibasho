<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gorra de beisbol, de frente. La banda apoya en la cabeza en (18..82, 70). -->
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85D1A1"/>
      <stop offset=".55" stop-color="#43B86F"/>
      <stop offset="1" stop-color="#399D64"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B86F"/>
      <stop offset="1" stop-color="#399D64"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
  </defs>
  <!-- Copa -->
  <path d="M17 72 C17 45 31 31 50 31 C69 31 83 45 83 72 Q50 64 17 72 Z"
        fill="url(#dome)" stroke="#2A7453" stroke-width="2" stroke-linejoin="round"/>
  <!-- Costuras de los gajos -->
  <path d="M50 32 L50 66 M38 34 Q31 48 32 67 M62 34 Q69 48 68 67"
        fill="none" stroke="#2A7453" stroke-opacity=".35" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Brillo en el lado de la luz -->
  <path d="M26 56 C26 44 34 36 45 35 C40 40 34 47 31 58 Q28 60 26 56 Z" fill="url(#shine)"/>
  <!-- Boton de arriba -->
  <circle cx="50" cy="31" r="3.4" fill="#85D1A1" stroke="#2A7453" stroke-width="1.4"/>
  <!-- Chapa con una estrella: el detalle con vida -->
  <circle cx="50" cy="53" r="7.5" fill="url(#badge)" stroke="#2A7453" stroke-opacity=".6" stroke-width="1.2"/>
  <path d="M50 48.3 L51.5 51.6 L55 52 L52.4 54.4 L53.1 57.8 L50 56.1 L46.9 57.8 L47.6 54.4 L45 52 L48.5 51.6 Z"
        fill="#43B86F" stroke="#2A7453" stroke-width=".6" stroke-linejoin="round"/>
  <!-- Visera, delante de la copa -->
  <path d="M21 69 Q50 63 79 69 C84 71 84 76 78 80 C66 88 34 88 22 80 C16 76 16 71 21 69 Z"
        fill="url(#bill)" stroke="#2A7453" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sombra de la copa sobre la visera y canto de luz -->
  <path d="M23 71 Q50 66 77 71 Q50 70 23 74 Z" fill="#2A7453" fill-opacity=".35"/>
  <path d="M26 79 C38 85 62 85 74 79" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
