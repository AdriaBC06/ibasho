<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 70">
  <!-- Te de burbujas en su vaso con tapa de cupula, de pie. La base pisa en y=68. -->
  <defs>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCBDA2"/>
      <stop offset=".6" stop-color="#C99A70"/>
      <stop offset="1" stop-color="#A78464"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#948277"/>
      <stop offset="1" stop-color="#5A3E2E"/>
    </linearGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#8A6A5E"/>
      <stop offset="1" stop-color="#3B2A25"/>
    </radialGradient>
  </defs>
  <!-- Pajita gorda, entra por la cupula -->
  <path d="M19 1.5 L23.5 2.5 L20.5 44 L16 44 Z" fill="url(#straw)" stroke="#36312F" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Te -->
  <path d="M6.3 27 L29.7 27 L27 64 Q26.8 67 23.8 67 L12.2 67 Q9.2 67 9 64 Z" fill="url(#tea)"/>
  <!-- Burbujas de tapioca en el fondo -->
  <g fill="url(#pearl)">
    <circle cx="12.5" cy="62.5" r="3"/><circle cx="18.5" cy="63" r="3"/><circle cx="24" cy="62.3" r="3"/>
    <circle cx="15.5" cy="57.5" r="3"/><circle cx="21.5" cy="57.8" r="3"/><circle cx="11.5" cy="56" r="2.6"/><circle cx="25" cy="55.8" r="2.6"/>
  </g>
  <!-- Carita -->
  <circle cx="14" cy="40" r="1.4" fill="#746453"/><circle cx="22" cy="40" r="1.4" fill="#746453"/>
  <path d="M16 43 Q18 45 20 43" fill="none" stroke="#746453" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="11.5" cy="43" rx="1.8" ry="1" fill="#FF8FA8" fill-opacity=".6"/><ellipse cx="24.5" cy="43" rx="1.8" ry="1" fill="#FF8FA8" fill-opacity=".6"/>
  <!-- Vaso de plastico -->
  <path d="M5 23 L31 23 L27.5 64.5 Q27 68 23.5 68 L12.5 68 Q9 68 8.5 64.5 Z"
        fill="url(#cup)" stroke="#746453" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cupula -->
  <path d="M5.5 22 Q5.5 10 18 10 Q30.5 10 30.5 22 Z" fill="#FFFFFF" fill-opacity=".35" stroke="#746453" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="3.5" y="21" width="29" height="3.6" rx="1.8" fill="#FFFFFF" stroke="#746453" stroke-width="1.3"/>
  <path d="M9 18 Q10 13.5 15 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M8.5 28 L10.5 60" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.8" stroke-linecap="round"/>
</svg>
