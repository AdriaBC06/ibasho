<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 60">
  <!-- Osito de peluche, en la mano izquierda: la pata que se agarra acaba
       en (44, 38), pegada al costado. -->
  <defs>
    <radialGradient id="fur" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#D2AF90"/>
      <stop offset=".6" stop-color="#B98455"/>
      <stop offset="1" stop-color="#9A724E"/>
    </radialGradient>
  </defs>
  <g stroke="#6B5844" stroke-width="1.6" stroke-linejoin="round">
    <!-- Piernas -->
    <ellipse cx="16" cy="53" rx="7" ry="5.5" fill="url(#fur)"/>
    <ellipse cx="32" cy="53" rx="7" ry="5.5" fill="url(#fur)"/>
    <!-- Cuerpo -->
    <ellipse cx="24" cy="41" rx="13" ry="13" fill="url(#fur)"/>
    <!-- Brazos: el derecho estirado hacia el Tama -->
    <ellipse cx="11" cy="38" rx="5" ry="7" fill="url(#fur)" transform="rotate(25 11 38)"/>
    <path d="M33 36 Q40 33 45 36 Q48 40 44 42 Q38 43 34 42 Z" fill="url(#fur)"/>
    <!-- Orejas -->
    <circle cx="12" cy="9" r="6" fill="url(#fur)"/>
    <circle cx="36" cy="9" r="6" fill="url(#fur)"/>
    <!-- Cabeza -->
    <circle cx="24" cy="19" r="13" fill="url(#fur)"/>
  </g>
  <circle cx="12" cy="9" r="3" fill="#EBD2B0"/>
  <circle cx="36" cy="9" r="3" fill="#EBD2B0"/>
  <ellipse cx="24" cy="44" rx="7" ry="7.5" fill="#EBD2B0" fill-opacity=".8"/>
  <ellipse cx="16" cy="54" rx="3.5" ry="3" fill="#EBD2B0"/>
  <ellipse cx="32" cy="54" rx="3.5" ry="3" fill="#EBD2B0"/>
  <!-- Cara -->
  <ellipse cx="24" cy="24" rx="6" ry="4.6" fill="#EBD2B0" stroke="#6B5844" stroke-opacity=".4" stroke-width=".8"/>
  <ellipse cx="24" cy="22.4" rx="2.2" ry="1.6" fill="#2B2230"/>
  <path d="M24 24 L24 26 M21.6 26.4 Q24 28 26.4 26.4" fill="none" stroke="#2B2230" stroke-width="1" stroke-linecap="round"/>
  <circle cx="18.5" cy="17" r="1.8" fill="#2B2230"/>
  <circle cx="29.5" cy="17" r="1.8" fill="#2B2230"/>
  <circle cx="19" cy="16.4" r=".6" fill="#FFFFFF"/>
  <circle cx="30" cy="16.4" r=".6" fill="#FFFFFF"/>
  <!-- Lazo al cuello -->
  <path d="M24 32 L17 28.5 L17 35.5 Z M24 32 L31 28.5 L31 35.5 Z" fill="#E8323C" stroke="#852B37" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="24" cy="32" r="2" fill="#E8323C" stroke="#852B37" stroke-width="1"/>
  <path d="M16 12 Q19 8 24 7.6" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
</svg>
