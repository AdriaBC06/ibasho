<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Las correas de la randoseru, delante del cuerpo (mismo lienzo que
       randoseru.svg): bajan por los costados. -->
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#757B85"/>
      <stop offset=".5" stop-color="#2B3444"/>
      <stop offset="1" stop-color="#253140"/>
    </linearGradient>
  </defs>
  <g id="strap-left">
    <path d="M37 30 Q31 52 36 76 L42.5 75 Q38 52 43.5 31 Z" fill="url(#strap)" stroke="#1D2C3B" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="35.5" y="56" width="7.5" height="5" rx="1.2" fill="#F5C542" stroke="#8A6A1E" stroke-width="1"/>
  </g>
  <use href="#strap-left" transform="matrix(-1 0 0 1 120 0)"/>
</svg>
