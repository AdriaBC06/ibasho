<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Auriculares. La cabeza ocupa (14..86) a la altura de los cascos, y=52;
       el arco pasa por encima de la coronilla, y=8. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset=".55" stop-color="#F3F6F9"/>
      <stop offset="1" stop-color="#C9D0D5"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#778C9D"/>
      <stop offset="1" stop-color="#8FA3B5"/>
    </linearGradient>
  </defs>
  <!-- Arco -->
  <path d="M13 50 C11 24 28 6 50 6 C72 6 89 24 87 50" fill="none" stroke="#8B979F" stroke-width="7.4" stroke-linecap="round"/>
  <path d="M13 50 C11 24 28 6 50 6 C72 6 89 24 87 50" fill="none" stroke="url(#shell)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M22 26 C28 16 38 11 48 10" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  <g id="cup">
    <!-- Almohadilla contra la cabeza y casco -->
    <rect x="14" y="40" width="6" height="24" rx="3" fill="url(#pad)" stroke="#546979" stroke-width="1.2"/>
    <rect x="3" y="37" width="14" height="30" rx="7" fill="url(#shell)" stroke="#8B979F" stroke-width="1.8"/>
    <path d="M6.5 44 Q7 40 10 39.5" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="10" cy="52" r="3" fill="#8FA3B5" stroke="#546979" stroke-opacity=".6" stroke-width=".8"/>
  </g>
  <use href="#cup" transform="matrix(-1 0 0 1 100 0)"/>
</svg>
