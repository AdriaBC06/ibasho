    <path d="M-6 -3 C-6 -9 6 -9 6 -3 C6 0 4 1 4 3 L-4 3 C-4 1 -6 0 -6 -3 Z" fill="#F4F7FA" stroke="#C9D3DD" stroke-width=".8"/>
    <circle cx="-2.3" cy="-3.2" r="1.5" fill="#253646"/>
    <circle cx="2.3" cy="-3.2" r="1.5" fill="#253646"/>
  </g>
  <!-- Brillo -->
  <path d="M20 54 Q26 50 32 46" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round"/>
