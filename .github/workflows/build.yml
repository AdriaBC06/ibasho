# Ibasho — compila y empaqueta la version de Windows.
# Copyright (C) 2026 Adrià Bonnin Catalán
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Desde la 0.6.2, Android y Linux se compilan en local: el APK se firma con la
# clave de release, que no sale del ordenador (android/key.properties), y asi
# se instala encima de la version anterior. Aqui solo queda Windows, que no se
# puede compilar desde Linux, y el workflow se lanza a mano:
#   gh workflow run build.yml --ref vX.Y.Z
#
# Secrets que espera el repositorio:
#   IBASHO_API_KEY         obligatorio, clave web del proyecto Firebase
#   IBASHO_DATABASE_URL    obligatorio, URL de la Realtime Database sin barra final
#   IBASHO_PROJECT_ID      opcional
#   IBASHO_EMAIL_DOMAIN    opcional, por defecto ibasho.top

name: Compilar

on:
  workflow_dispatch:

# La misma version del SDK con la que esta hecho el proyecto (ver .metadata).
# Subirla sin probar rompe la resolucion de intl: no se toca a la ligera.
env:
  FLUTTER_VERSION: '3.41.2'

jobs:
  comprobar:
    name: Analisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Reconstruir .env desde los secrets
        shell: bash
        env:
          API_KEY: ${{ secrets.IBASHO_API_KEY }}
          DATABASE_URL: ${{ secrets.IBASHO_DATABASE_URL }}
          PROJECT_ID: ${{ secrets.IBASHO_PROJECT_ID }}
          EMAIL_DOMAIN: ${{ secrets.IBASHO_EMAIL_DOMAIN }}
        run: |
          {
            echo "IBASHO_API_KEY=$API_KEY"
            echo "IBASHO_DATABASE_URL=$DATABASE_URL"
            echo "IBASHO_EMAIL_DOMAIN=${EMAIL_DOMAIN:-ibasho.top}"
            echo "IBASHO_USE_EMULATOR=false"
            echo "IBASHO_PROJECT_ID=$PROJECT_ID"
          } > .env

      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

  compilar:
    name: ${{ matrix.nombre }}
    needs: comprobar
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows
            nombre: Windows (instalador y zip)
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Reconstruir .env desde los secrets
        shell: bash
        env:
          API_KEY: ${{ secrets.IBASHO_API_KEY }}
          DATABASE_URL: ${{ secrets.IBASHO_DATABASE_URL }}
          PROJECT_ID: ${{ secrets.IBASHO_PROJECT_ID }}
          EMAIL_DOMAIN: ${{ secrets.IBASHO_EMAIL_DOMAIN }}
        run: |
          {
            echo "IBASHO_API_KEY=$API_KEY"
            echo "IBASHO_DATABASE_URL=$DATABASE_URL"
            echo "IBASHO_EMAIL_DOMAIN=${EMAIL_DOMAIN:-ibasho.top}"
            echo "IBASHO_USE_EMULATOR=false"
            echo "IBASHO_PROJECT_ID=$PROJECT_ID"
          } > .env

      - name: Leer la version de pubspec.yaml
        id: version
        shell: bash
        # En bloque y no en linea: el `version: ` del sed lleva dos puntos y
        # espacio, y en un escalar suelto YAML lo lee como una clave anidada.
        run: |
          echo "valor=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------- Windows
      - name: Inno Setup
        if: matrix.plataforma == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Compilar y empaquetar Windows
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: .\tool\package_windows.ps1

      # ------------------------------------------------------------ Artefacto
      - uses: actions/upload-artifact@v4
        with:
          name: ibasho-${{ steps.version.outputs.valor }}-${{ matrix.plataforma }}
          path: dist/*
          if-no-files-found: error
